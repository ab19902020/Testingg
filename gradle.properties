org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Android SDK used by the custom APK pipeline (see BUILDING.md).
# Defaults come from ANDROID_HOME / ANDROID_SDK_ROOT; override in local.properties or with -P.
clrg.compileSdk=35
clrg.buildToolsVersion=35.0.0
clrg.minSdk=29
clrg.targetSdk=35
clrg.versionCode=6
clrg.versionName=1.4.0
# ABIs packaged into the APK (arm64-v8a is the target; x86_64 lets the UI start in an emulator).
clrg.abis=arm64-v8a,x86_64
