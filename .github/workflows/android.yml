name: Build ColourFilm

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (colourisation core)
        run: ./gradlew :core:test
      - name: Build APKs
        run: ./gradlew :app:assembleSnapdragonRelease :app:assembleUniversalRelease
      - uses: actions/upload-artifact@v4
        with:
          name: colourfilm-apks
          path: app/build/outputs/apk/*/release/*.apk
