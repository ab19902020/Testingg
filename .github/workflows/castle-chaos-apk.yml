name: Castle Chaos APK

# Builds the Android app and attaches the APK to a GitHub release,
# so it can be downloaded and installed straight from a phone.
on:
  push:
    paths:
      - 'castle-chaos/**'
      - 'castle-chaos-android/**'
      - '.github/workflows/castle-chaos-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: castle-chaos-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add these repository secrets to sign with your own key, so future
      # updates install over the old version: ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "No signing secrets set; signing with a debug key."
          fi

      - name: Build APK
        env:
          CC_VERSION_CODE: ${{ github.run_number }}
          CC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/CastleChaos.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CastleChaos-apk
          path: CastleChaos.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: castle-chaos-build-${{ github.run_number }}
          name: Castle Chaos (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: CastleChaos.apk
          body: |
            Download **CastleChaos.apk** below on your Android phone and open it to install.
            You may need to allow "Install unknown apps" for your browser or Files app.
